<script>
const $=s=>document.querySelector(s),K='financi_v1';let S,mem=null,tab='home',rs=0;
const def=()=>({budgets:{},fixed:[],exp:[],adj:[],inc:[],rec:{},tgt:0,goals:[],hrs:{},rules:{},cb:{},lc:'',cats:["אוכל","תחבורה","בית","בריאות","קניות","מנויים","בילוי","אחר"]});
function load(){try{const r=localStorage.getItem(K);S=Object.assign(def(),r?JSON.parse(r):{})}catch(e){S=mem||def()}}

const p2=n=>String(n).padStart(2,'0'),mk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1),today=()=>{const d=new Date();return mk(d)+'-'+p2(d.getDate())};

const addM=(m,n)=>{const[y,o]=m.split('-').map(Number);return mk(new Date(y,o-1+n,1))};
const mName=m=>{const[y,o]=m.split('-').map(Number);return new Date(y,o-1,1).toLocaleDateString('he-IL',{month:'long',year:'numeric'})};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('he-IL')+' ₪',uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fAmt(f,m){if(m<f.start||(f.until&&m>f.until)||f.skip.includes(m))return null;if(f.ov[m]!=null)return f.ov[m];let a=f.amts[0].amount;for(const x of f.amts)if(x.from<=m)a=x.amount;return a}
const fixedList=m=>S.fixed.map(f=>({f,a:fAmt(f,m)})).filter(x=>x.a!=null),fixedTot=m=>fixedList(m).filter(x=>!x.f.inc).reduce((s,x)=>s+x.a,0);
const varList=m=>S.exp.filter(e=>e.date.startsWith(m)&&!e.inc).sort((a,b)=>b.date.localeCompare(a.date)),varTot=m=>varList(m).reduce((s,e)=>s+e.amount,0);
const tyAt=(i,m)=>{let t=i.types[0].type;for(const x of i.types)if(x.from<=m)t=x.type;return t};
const vAt=(a,m,k)=>{let v=a[0][k];for(const x of a)if(x.from<=m)v=x[k];return v};
function gross(i,m){if(m<i.start)return 0;const t=tyAt(i,m);if(t=='potential')return 0;if(t=='fixed')return i.ov[m]!=null?i.ov[m]:vAt(i.amts,m,'amount');return (S.rec[i.id]||{})[m]||0}
function inet(i,m){const g=gross(i,m),n=g-fixedList(m).filter(x=>x.f.inc==i.id).reduce((s,x)=>s+x.a,0)-S.exp.filter(e=>e.inc==i.id&&e.date.startsWith(m)).reduce((s,e)=>s+e.amount,0),tx=Math.max(0,n)*vAt(i.tax,m,'pct')/100;return{g,n,tx,f:n-tx}}
const incs=m=>S.inc.filter(i=>i.start<=m&&(!i.end||m<=i.end)),isum=(m,k)=>incs(m).reduce((s,i)=>s+inet(i,m)[k],0);
const budget=m=>S.budgets[m]!=null?S.budgets[m]:isum(addM(m,-1),'f');
const remain=m=>budget(m)-fixedTot(m)-varTot(m);
function accum(){let t=S.adj.reduce((s,a)=>s+a.amount,0);const ms=new Set(Object.keys(S.budgets));S.exp.forEach(e=>ms.add(e.date.slice(0,7)));S.inc.forEach(i=>{let m=i.start;while(m<nowM){ms.add(m);m=addM(m,1)}});S.fixed.forEach(f=>{let m=f.start;while(m<nowM&&(!f.until||m<=f.until)){ms.add(m);m=addM(m,1)}});ms.forEach(m=>{if(m<nowM)t+=remain(m)});return t}
const ICON=`<svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#f2c14e"/><text x="50" y="52" text-anchor="middle" font-family="Heebo, sans-serif" font-weight="800" font-size="54" fill="#14231f">פ</text><rect x="28" y="70" width="10" height="8" rx="2" fill="#1f7a5c"/><rect x="45" y="64" width="10" height="14" rx="2" fill="#1f7a5c"/><rect x="62" y="56" width="10" height="22" rx="2" fill="#14231f"/></svg>`,BR=`<div class="brand">${ICON}<b>פיננסי</b></div>`;
let UNDO='',PU=0,UT=0,PF=null,HT=0;const sn=()=>{UNDO=JSON.stringify(S)};
function toast(t,u){const e=$('#tt');e.innerHTML=esc(t)+(u?' <button data-a="undo" style="margin-inline-start:10px;border:0;border-radius:10px;padding:4px 12px;background:var(--gold);color:#12211c;font:inherit;font-weight:700">ביטול</button>':'');e.style.display='block';clearTimeout(UT);UT=setTimeout(()=>e.style.display='none',u?7000:2200)}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}const closeS=()=>$('#ov').classList.remove('on');
function home(){const b=budget(cur),ft=fixedTot(cur),vt=varTot(cur),r=b-ft-vt,ac=accum(),pc=b>0?Math.min(100,Math.max(0,(ft+vt)/b*100)):(ft+vt>0?100:0);
return BR+`<div class="card big"><div class="l">ניהול תקציב · כמה נשאר מהתקציב אחרי ההוצאות</div><div class="n ${r<0?'neg':''}">${fmt(r)}</div><div class="bar"><i style="width:${pc}%" class="${r<0?'bad':''}"></i></div><div class="rw"><span>תקציב</span><b>${fmt(b)}</b></div><div class="rw"><span>הוצאות קבועות</span><b>${fmt(ft)}</b></div><div class="rw"><span>הוצאות נוספות</span><b>${fmt(vt)}</b></div><button class="ln" data-a="budget">עריכת התקציב לחודש הזה</button></div>
<div class="card"><div class="l">יתרה מצטברת</div><div class="n ${ac<0?'neg':''}">${fmt(ac)}</div><div class="s">שאריות של חודשים שהסתיימו. חודש במינוס מוריד מהיתרה.</div><button class="ln" data-a="adj">הוספה או הפחתה ידנית</button></div>
<div class="card"><div class="l">הכנסות החודש (נטו)</div><div class="n">${fmt(isum(cur,'f'))}</div><div class="rw"><span>שמור למס</span><b>${fmt(isum(cur,'tx'))}</b></div><div class="rw"><span>תקציב צפוי לחודש הבא</span><b>${fmt(isum(cur,'f'))}</b></div></div>`}
function expV(){const l=varList(cur);return `<h3>הוצאות נוספות: ${fmt(varTot(cur))}</h3>`+(l.length?l.map(e=>`<div class="it" data-a="edit" data-id="${e.id}"><div><b>${esc(e.name||e.cat)}</b><div class="s">${e.date.slice(8)}/${e.date.slice(5,7)} · ${esc(e.cat)}</div></div><b>${fmt(e.amount)}</b></div>`).join(''):'<p class="s">אין הוצאות החודש. לחץ על + כדי להוסיף.</p>')}
const TY=[['fixed','קבועה'],['random','אקראית'],['potential','פוטנציאלית']],TL={fixed:'קבועה',random:'אקראית',potential:'פוטנציאלית'},LB={fixed:'סכום חודשי קבוע. נרשם אוטומטית כל חודש.',random:'כמה הרווחת החודש הזה (מזינים בפועל).',potential:'צפי בלבד. לא נכנס לתקציב עד שהופך להכנסה אמיתית.'};
function incVOld(){const l=incs(cur);return `<h3>הכנסות · נטו ${fmt(isum(cur,'f'))}</h3>`+(l.length?l.map(i=>{const t=tyAt(i,cur),r=inet(i,cur);return `<div class="it" data-a="inc" data-id="${i.id}"><div><b>${esc(i.name)}</b><div class="s">${TL[t]}${r.tx?' · מס '+fmt(r.tx):''}</div></div><b>${t=='potential'?'צפי '+fmt(vAt(i.amts,cur,'amount')):fmt(r.f)}</b></div>`}).join(''):'<p class="s">אין הכנסות עדיין. הוסף הכנסה והתקציב יתמלא ממנה בחודש הבא.</p>')+'<button class="btn" data-a="addinc">הוספת הכנסה</button>'}
function incSheetOld(id){const i=id&&S.inc.find(x=>x.id==id),t=i?tyAt(i,cur):'fixed',r=i&&inet(i,cur),hr=i&&(S.hrs[i.id]||{})[cur];
const am=i?(t=='random'?((S.rec[i.id]||{})[cur]??''):t=='fixed'&&i.ov[cur]!=null?i.ov[cur]:vAt(i.amts,cur,'amount')):'';
const ex=i?S.fixed.filter(f=>f.inc==i.id&&fAmt(f,cur)!=null).map(f=>`<div class="it" data-a="fix" data-id="${f.id}"><span>${esc(f.name)}</span><b>${fmt(fAmt(f,cur))}</b></div>`).join('')+S.exp.filter(e=>e.inc==i.id&&e.date.startsWith(cur)).map(e=>`<div class="it" data-a="edit" data-id="${e.id}"><span>${esc(e.name||e.cat)}</span><b>${fmt(e.amount)}</b></div>`).join(''):'';
sheet(`<h3>${i?esc(i.name):'הכנסה חדשה'}</h3><input id="fn" placeholder="שם ההכנסה" value="${i?esc(i.name):''}"><div class="chips">${TY.map(([k,l])=>`<button class="chip ${k==t?'on':''}" data-a="ty" data-v="${k}">${l}</button>`).join('')}</div><input id="fa" type="number" inputmode="decimal" placeholder="סכום ₪" value="${am}"><div class="s" id="fl">${LB[t]}</div><input id="ft" type="number" inputmode="decimal" placeholder="הפרשה למס %" value="${i?vAt(i.tax,cur,'pct'):0}"><div class="s">הפרשה למס באחוזים, מכאן והלאה. ברירת מחדל 0.</div><input id="fh" type="number" inputmode="decimal" placeholder="שעות עבודה החודש (לא חובה)" value="${hr||''}">${i?`<div class="card" style="margin-top:12px"><div class="rw"><span>ברוטו</span><b>${fmt(r.g)}</b></div><div class="rw"><span>הוצאות ההכנסה</span><b>${fmt(r.g-r.n)}</b></div><div class="rw"><span>הפרשה למס</span><b>${fmt(r.tx)}</b></div><div class="rw"><span>נטו לתקציב</span><b>${fmt(r.f)}</b></div>${hr>0?`<div class="rw"><span>נטו לשעה</span><b>${fmt(r.f/hr)}</b></div>`:''}</div>${ex}${tkH(i,t)}<div class="rw2"><button class="btn" data-a="addexpi" data-id="${i.id}">הוצאה חד־פעמית</button><button class="btn" data-a="addfix" data-id="${i.id}">הוצאה קבועה</button></div>`:''}<div class="rw2"><button class="btn" data-a="saveinc" data-id="${id||''}" data-m="a">שמירה מכאן והלאה</button>${i?`<button class="btn" data-a="saveinc" data-id="${id}" data-m="m">שמירה לחודש זה</button>`:''}</div>`)}
const mS=m=>{const[y,o]=m.split('-').map(Number);return new Date(y,o-1,1).toLocaleDateString('he-IL',{month:'short'})};
const ms6=()=>{const a=[];for(let k=5;k>=0;k--)a.push(addM(cur,-k));return a},expTot=m=>fixedTot(m)+varTot(m),catTot=m=>{const o={};varList(m).forEach(e=>o[e.cat]=(o[e.cat]||0)+e.amount);return o};
function chart(ms){const d=ms.map(m=>[isum(m,'f'),expTot(m)]),mx=Math.max(1,...d.flat()),W=340,H=140,st=(W-20)/6;
